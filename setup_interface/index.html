<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>PenPal Login</title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="description" content="" />

        <link rel="icon" href="favicon.png">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="logo_container">
            <img src="logo.png" class="logo" /> 
        </div>

        <h1>Pen Pals</h1>

        <h2>Connect your PenPal to WiFi</h2>

        <main>
            <form id="wifi_form">
                <div class="form_group">
                    <label for="networks">WiFi</label>
                    <select class="input_box" id="networks" name="networks">
                        <option value="PenPlotterWifi">PenPlotterWifi</option>
                    </select>
                </div>


                <div class="form_group">
                    <label for="password">WiFi Password</label>
                    <input class="input_box" name="password" type="password" id="password" placeholder="Your WiFi password..." />
                    <span id="status">Wrong password</span>
                </div>


                <button class="input_box" type="submit" id="submit">Connect</button>
            </form>

        </main>


        <script>
            const form = document.getElementById("wifi_form");
            const status_span = document.getElementById("status");
            form.addEventListener("submit", e => {
                e.preventDefault();
                const network = document.getElementById("networks").value;
                const password = document.getElementById("password").value;

                if (network != "PenPlotterWifi" || password != "penplotter") {
                    status_span.style.display = "block";
                } else {
                    status_span.innerText = "Connected!";
                    status_span.style.color = "green";
                    status_span.style.display = "block";
                }
            });
        </script>
    </body>
</html>
